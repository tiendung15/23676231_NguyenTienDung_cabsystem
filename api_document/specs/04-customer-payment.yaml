openapi: 3.0.3
info:
  title: CAB System - Customer Payment API
  version: 1.0.0
  description: Customer payment and transaction functions covering FR22-FR25.
servers:
  - url: https://api.cab-system.example.com
tags:
  - name: Customer Payment
paths:
  /customers/{customerId}/trips/{tripId}/payment:
    post:
      tags: [Customer Payment]
      summary: Choose payment method and pay
      operationId: payTrip
      parameters:
        - {$ref: '#/components/parameters/CustomerId'}
        - {$ref: '#/components/parameters/TripId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: {type: string, enum: [Cash, Electronic]}
      responses:
        '201': {description: Payment created}
        '402': {description: Payment failed}
        '409': {description: Trip is not payable}
  /customers/{customerId}/payments:
    get:
      tags: [Customer Payment]
      summary: View payment history
      operationId: getPaymentHistory
      parameters:
        - {$ref: '#/components/parameters/CustomerId'}
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Payment'}
  /customers/{customerId}/payments/{paymentId}:
    get:
      tags: [Customer Payment]
      summary: View payment details
      operationId: getPayment
      parameters:
        - {$ref: '#/components/parameters/CustomerId'}
        - name: paymentId
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Payment details}
  /customers/{customerId}/payments/{paymentId}/retry:
    post:
      tags: [Customer Payment]
      summary: Retry failed electronic payment
      operationId: retryPayment
      parameters:
        - {$ref: '#/components/parameters/CustomerId'}
        - name: paymentId
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Payment retry initiated}
        '409': {description: Payment cannot be retried}
components:
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: {type: integer}
    TripId:
      name: tripId
      in: path
      required: true
      schema: {type: integer}
  schemas:
    Payment:
      type: object
      properties:
        paymentId: {type: integer}
        tripId: {type: integer}
        method: {type: string}
        status: {type: string, enum: [Pending, Success, Failed]}
        amount: {type: number, format: double}
        paidAt: {type: string, format: date-time, nullable: true}
